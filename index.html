<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ludo Mody — لعبة لودو</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg1:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--primary:#e94560;--text:#fff;--muted:#a0a0a0;--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);--radius:16px;--shadow:0 8px 32px rgba(0,0,0,0.4);--board-size:600px}
html{font-size:16px}
body{font-family:Segoe UI,system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;color:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
button{cursor:pointer;font-family:inherit;border:none;outline:none;transition:all .25s}
input{font-family:inherit;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius)}
.btn{padding:12px 24px;border-radius:10px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--primary),#ff6b6b);color:#fff}
.btn-secondary{background:var(--glass);border:1px solid var(--glass-border);color:var(--text)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(233,69,96,0.3)}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#16213e,#1a1a2e);transition:opacity .6s}
.splash-logo{width:160px;height:160px;border-radius:32px;background:linear-gradient(135deg,#e94560,#ff6b6b);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:#fff;box-shadow:0 0 60px rgba(233,69,96,0.4);animation:splashPulse 2s ease infinite;margin-bottom:24px}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.splash-title{font-size:40px;font-weight:800;background:linear-gradient(135deg,#e94560,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
#login-screen{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-box{width:100%;max-width:400px;padding:40px 32px;text-align:center;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:24px;box-shadow:var(--shadow)}
.login-box h1{font-size:28px;margin-bottom:4px}
.login-box .sub{color:var(--muted);margin-bottom:28px;font-size:14px}
#lobby{min-height:100vh;padding:20px}
.lobby-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--glass-border);margin-bottom:24px}
.lobby-header h1{font-size:24px;color:#e94560}
.lobby-grid{display:grid;grid-template-columns:280px 1fr;gap:24px;max-width:1100px;margin:0 auto}
.lobby-card{padding:20px}
.lobby-card h3{font-size:15px;color:#e94560;margin-bottom:12px}
#game-screen{min-height:100vh;padding:12px}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.game-header h1{font-size:20px;color:#e94560}
.game-layout{display:flex;gap:16px;max-width:1100px;margin:0 auto;align-items:flex-start}
.game-main{flex:0 0 auto}
.game-side{flex:1;min-width:0}
#board-wrap{position:relative;width:var(--board-size);height:var(--board-size);margin:0 auto;border-radius:14px;padding:3px;background:linear-gradient(135deg,#ffd700,#d4a574,#8b6914);box-shadow:0 0 40px rgba(212,165,116,0.2),var(--shadow)}
#game-board{width:100%;height:100%;border-radius:11px;display:block;cursor:pointer}
.players-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.player-card{padding:10px 8px;text-align:center;border-radius:10px;transition:all .3s;background:var(--glass);border:2px solid transparent}
.player-card.active{border-color:#e94560;animation:activeGlow 1.5s ease infinite}
@keyframes activeGlow{0%,100%{box-shadow:0 0 8px rgba(233,69,96,0.2)}50%{box-shadow:0 0 20px rgba(233,69,96,0.5)}}
.player-card.winner{border-color:#4caf50;background:rgba(76,175,80,0.15)}
.player-card .p-color{width:24px;height:24px;border-radius:50%;margin:0 auto 4px;border:2px solid rgba(255,255,255,0.3)}
.player-card .p-name{font-size:12px;font-weight:600}
.player-card .p-status{font-size:10px;color:var(--muted);display:flex;justify-content:center;gap:3px}
.player-card .p-status .piece-dot{width:14px;height:14px;border-radius:50%;display:inline-block;opacity:.5}
.player-card .p-status .piece-dot.home{opacity:.3}
.player-card .p-status .piece-dot.active{opacity:1;box-shadow:0 0 6px currentColor}
.dice-area{text-align:center;margin-top:10px}
.dice-3d{width:64px;height:64px;perspective:400px;display:inline-block;cursor:pointer;margin:0 auto 8px}
.dice-3d.disabled{pointer-events:none;opacity:.5}
.dice-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.dice-cube.rolling{animation:diceRoll .5s ease-out}
@keyframes diceRoll{0%{transform:rotateX(0)}100%{transform:rotateX(720deg)}}
.dice-face{position:absolute;width:100%;height:100%;border-radius:10px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;padding:8px;background:linear-gradient(145deg,#fff,#e0e0e0);backface-visibility:hidden}
.dice-face .dot{width:10px;height:10px;border-radius:50%;background:#333;justify-self:center;align-self:center;display:none}
.dice-face .dot.show{display:block}
.dice-face[data-face="1"]{transform:translateZ(32px)}
.dice-face[data-face="6"]{transform:rotateY(180deg) translateZ(32px)}
.dice-face[data-face="2"]{transform:rotateY(-90deg) translateZ(32px)}
.dice-face[data-face="5"]{transform:rotateY(90deg) translateZ(32px)}
.dice-face[data-face="3"]{transform:rotateX(90deg) translateZ(32px)}
.dice-face[data-face="4"]{transform:rotateX(-90deg) translateZ(32px)}
.dice-roll-btn{padding:10px 28px;border-radius:10px;font-size:15px;font-weight:600;background:linear-gradient(135deg,#e94560,#ff6b6b);color:#fff}
.dice-roll-btn:disabled{opacity:.4;cursor:default}
.chat-box{display:flex;flex-direction:column;min-height:200px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:12px;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px;max-height:180px}
.chat-msg{padding:6px 10px;background:rgba(255,255,255,0.06);border-radius:8px;font-size:13px}
.chat-msg.system{text-align:center;background:transparent;color:var(--muted);font-size:11px}
.chat-foot{display:flex;padding:8px;gap:6px}
.chat-foot input{flex:1;padding:8px 12px;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);border-radius:8px;color:#fff;font-size:13px}
.chat-foot button{padding:8px 14px;background:#e94560;color:#fff;border-radius:8px;font-size:13px}
#game-over{position:fixed;inset:0;z-index:500;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px)}
.go-box{text-align:center;padding:40px 36px;max-width:400px;width:90%;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:24px}
.go-box h2{font-size:26px;margin-bottom:4px}
.go-box .trophy{font-size:64px;margin-bottom:12px;animation:bounce 1s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.go-box .winner-name{font-size:18px;color:#e94560;margin-bottom:20px}
.go-box .go-btns{display:flex;gap:10px;justify-content:center}
@media(max-width:1024px){:root{--board-size:480px}.lobby-grid{grid-template-columns:1fr}.game-layout{flex-direction:column;align-items:center}}
@media(max-width:768px){:root{--board-size:100vw}#game-screen{padding:8px}.players-row{gap:4px}.player-card{padding:6px 4px}.player-card .p-name{font-size:10px}.player-card .p-color{width:18px;height:18px}.player-card .p-status .piece-dot{width:10px;height:10px}.dice-3d{width:52px;height:52px}.dice-face[data-face="1"]{transform:translateZ(26px)}.dice-face[data-face="6"]{transform:rotateY(180deg) translateZ(26px)}.dice-face[data-face="2"]{transform:rotateY(-90deg) translateZ(26px)}.dice-face[data-face="5"]{transform:rotateY(90deg) translateZ(26px)}.dice-face[data-face="3"]{transform:rotateX(90deg) translateZ(26px)}.dice-face[data-face="4"]{transform:rotateX(-90deg) translateZ(26px)}}
.lobby-card .divider{display:flex;align-items:center;margin:12px 0;color:#a0a0a0;font-size:12px}.lobby-card .divider::before,.lobby-card .divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}.lobby-card .divider span{margin:0 10px}@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(20px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
<base target="_blank">
</head>

}
function cleanupRoom(){
  if(rmRef&&rmCb){rmRef.off('value',rmCb);rmCb=null}
  if(roomChatRef&&roomChatCb){roomChatRef.off('value',roomChatCb);roomChatCb=null}
  if(syncRef&&syncCb){syncRef.off('value',syncCb);syncCb=null}
}
function listenRoom(code){
  cleanupRoom();
  rmRef=fbd.ref('rooms/'+code);
  rmCb=snap=>{
    if(!snap.exists()){rs('🔴 الغرفة أغلقت');leaveRoom();return}
    const data=snap.val(),pl=data.players||{};
    const plArr=Object.values(pl).filter(p=>p);
    document.getElementById('room-players').innerHTML=plArr.map((p,i)=>'<div style="display:flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(255,255,255,0.05);border-radius:20px;font-size:12px"><div style="width:10px;height:10px;border-radius:50%;background:'+['#e53935','#43a047','#fdd835','#1e88e5'][i]+'"></div>'+(p.online?'🟢':'🔴')+' '+p.name+'</div>').join('');
    if(data.status==='playing'&&data.state&&!G){G=data.state;isOnline=true;sg();up();syncListenGame();listenRoomChat();lg('🔄 تم استعادة اللعبة')}
    if(data.status==='finished'){rs('🏁 انتهت اللعبة')}
    const myIdx=plArr.findIndex(p=>fau&&fau.currentUser&&p.id===fau.currentUser.uid);
    if(myIdx>=0){rmPlayerIdx=myIdx;document.getElementById('leave-room-btn').style.display='block'}
    document.getElementById('online-start-btn').classList.toggle('hidden',data.status!=='waiting');
  };
  rmRef.on('value',rmCb);
}
function startOnlineGame(){
  if(!curRoom||!rmRef){toast('⚠️ لست في غرفة');return}
  if(rmPlayerIdx!==0){toast('⚠️ فقط منشئ الغرفة يمكنه البدء');return}
  rmRef.once('value').then(snap=>{
    if(!snap.exists())return;
    const data=snap.val(),pl=Object.values(data.players||{}).filter(p=>p);
    if(pl.length<2){toast('⚠️ انتظر لاعبين آخرين');return}
    if(pl.filter(p=>p.online).length<2){toast('⚠️ بعض اللاعبين غير متصلين');return}
    const g={players:pl.slice(0,4).map((pl2,i)=>({name:pl2.name,color:i,pieces:[-1,-1,-1,-1],finished:0,isAI:false,id:pl2.id||''})),dice:0,turn:0,sixes:0,phase:'rolling',winner:-1};
    rmRef.update({state:g,status:'playing'}).then(()=>{
      G=g;isOnline=true;document.getElementById('online-start-btn').classList.add('hidden');
      sg();up();lg('🎲 بدأت اللعبة الأونلاين!');syncListenGame();listenRoomChat();sendOnlineSystem('🎲 بدأت اللعبة!');
      if(rmPlayerIdx!==G.turn){G.phase='rolling_wait';ub()}
    })
  })
}
function fallbackCopy(t){const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();document.execCommand('copy');document.body.removeChild(i);toast('✅ تم نسخ الرمز: '+t)}
function copyRoomCode(){const c=document.getElementById('room-code').value;if(!c)return;if(navigator.clipboard){navigator.clipboard.writeText(c).then(()=>toast('✅ تم نسخ الرمز: '+c)).catch(()=>fallbackCopy(c))}else fallbackCopy(c);}
function upRO(){const inRoom=curRoom!==null;document.getElementById('online-start-btn').classList.toggle('hidden',!inRoom);document.getElementById('copy-code-btn').style.display=inRoom?'inline-flex':'none';if(inRoom)document.getElementById('room-code').value=curRoom}
function rs(t){document.getElementById('room-status').textContent=t}
function setOnlineStatus(online){
  if(!curRoom||!fau?.currentUser)return;
  fbd.ref('rooms/'+curRoom+'/players/'+rmPlayerIdx).update({online,name:fau.currentUser.displayName||cu.name,photo:fau.currentUser.photoURL||'',id:fau.currentUser.uid})
}
window.addEventListener('beforeunload',()=>{if(curRoom)setOnlineStatus(false)});
// ======================== MULTIPLAYER SYNC ========================
function syncListenGame(){
  if(syncRef&&syncCb){syncRef.off('value',syncCb);syncCb=null}
  if(!curRoom)return;
  syncRef=fbd.ref('rooms/'+curRoom+'/state');
  syncCb=snap=>{
    if(!snap.exists()||!G||G.winner>=0)return;
    const remote=snap.val();
    if(remote._from===fau?.currentUser?.uid)return;
    if(remote.turn!==G.turn||remote.dice!==G.dice||remote.phase!==G.phase||remote.winner!==G.winner){
      G.players.forEach((p,i)=>{if(remote.players[i])p.pieces=[...remote.players[i].pieces]});
      G.turn=remote.turn;G.dice=remote.dice;G.phase=remote.phase;G.winner=remote.winner;
      if(G.winner>=0)sgo(G.winner);else up()
    }
  };
  syncRef.on('value',syncCb);
}
function syncGameState(){
  if(!curRoom||!isOnline||!G)return;
  fbd.ref('rooms/'+curRoom+'/state').update({...G,_from:fau?.currentUser?.uid||'',_ts:Date.now()});
}
// ======================== MULTIPLAYER CHAT ========================
function sendOnlineChat(text){
  if(!curRoom)return;
  fbd.ref('rooms/'+curRoom+'/chat').push({text,name:cu.name,time:firebase.database.ServerValue.TIMESTAMP});
}
function sendOnlineSystem(text){
  if(!curRoom)return;
  fbd.ref('rooms/'+curRoom+'/chat').push({text,system:true,time:firebase.database.ServerValue.TIMESTAMP});
}
function listenRoomChat(){
  if(roomChatRef&&roomChatCb){roomChatRef.off('value',roomChatCb);roomChatCb=null}
  if(!curRoom)return;
  roomChatRef=fbd.ref('rooms/'+curRoom+'/chat').orderByChild('time').limitToLast(50);
  roomChatCb=snap=>{
    if(!snap.exists())return;
    const msgs=[];snap.forEach(c=>{const v=c.val();msgs.push(v)});
    const c=document.getElementById('chat-msgs');c.innerHTML='';
    msgs.forEach(m=>{
      const d=document.createElement('div');d.className='chat-msg';
      if(m.system)d.innerHTML='<div style="text-align:center;color:#a0a0a0;font-size:11px">'+m.text+'</div>';
      else d.innerHTML='<div class="sender" style="font-weight:600;font-size:11px;margin-bottom:1px">'+m.name+'</div><div>'+m.text+'</div>';
      c.appendChild(d)
    });
    c.scrollTop=c.scrollHeight
  };
  roomChatRef.on('value',roomChatCb);
}
function updateLobby(){document.getElementById('lobby-name').textContent=cu.name;document.getElementById('lobby-avatar').textContent=cu.name[0]||'?';const s=JSON.parse(localStorage.getItem('lums')||'{"w":0,"g":0}');document.getElementById('stat-wins').textContent=s.w;document.getElementById('stat-games').textContent=s.g;document.getElementById('stat-rate').textContent=s.g>0?Math.round(s.w/s.g*100)+'%':'0%';document.getElementById('players-config').innerHTML=['أنت','AI 1','AI 2','AI 3'].map((n,i)=>'<div class="player-config" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:rgba(255,255,255,0.05);border-radius:8px"><span class="color-dot" style="width:20px;height:20px;border-radius:50%;background:'+['#e53935','#43a047','#fdd835','#1e88e5'][i]+';flex-shrink:0"></span><label style="font-size:13px;flex:1">'+n+'</label><span style="font-size:11px;color:#a0a0a0">'+(i===0?'👤 أنت':'🤖 AI')+'</span></div>').join('');const fbOk=!!(fau&&fau.currentUser);document.getElementById('online-logged-out').style.display=fbOk?'none':'block';document.getElementById('online-logged-in').style.display=fbOk?'block':'none'}
function startLocalGame(){const df=document.getElementById('ai-diff').value;cg(cu.name,df);sg();const wr=document.getElementById('board-wrap');const newSize=wr.offsetWidth||600;if(newSize>0){cv.width=newSize;cv.height=newSize;}up();lg('🎲 بدأت اللعبة الجديدة!');lg('🎯 دور: '+G.players[G.turn].name);if(G.players[G.turn].isAI)setTimeout(()=>at(),800)}
function confirmLeave(){if(G&&G.phase!=='won'&&G.phase!=='waiting'&&!confirm('هل تريد الخروج؟'))return;if(isOnline&&curRoom){leaveRoom();cleanupRoom()}btl()}
function backToLobby(){document.getElementById('game-over').classList.add('hidden');document.getElementById('chat-msgs').innerHTML='';document.getElementById('dice-result').textContent='';document.getElementById('dice-cube').style.transform='';G=null;sel=-1;isOnline=false;cleanupRoom();slo()}
function showGameOver(wi){const p=G.players[wi],c=COLORS[p.color];document.getElementById('go-name').textContent='🏆 '+p.name;document.getElementById('game-over').classList.remove('hidden');const s=JSON.parse(localStorage.getItem('lums')||'{"w":0,"g":0}');s.g++;if(!p.isAI)s.w++;localStorage.setItem('lums',JSON.stringify(s));document.getElementById('go-rematch-btn').style.display=isOnline?'none':'inline-flex';if(isOnline&&curRoom)rmRef.update({status:'finished'})}
cv.addEventListener('click',handleBoardClick);
let touchHandled=false;
cv.addEventListener('touchstart',e=>{e.preventDefault();if(touchHandled)return;touchHandled=true;const t=e.touches[0];handleBoardClick({clientX:t.clientX,clientY:t.clientY});setTimeout(()=>touchHandled=false,300)},{passive:false});
window.addEventListener('resize',()=>{if(!document.getElementById('game-screen').classList.contains('hidden')){const wr=document.getElementById('board-wrap');const newSize=wr.offsetWidth||600;if(newSize>0){cv.width=newSize;cv.height=newSize;}if(G)db()}});
console.log('🎲 Ludo Mody v2.1 — Fixed & Enhanced');

var rpl=renderPlayers,ud=updateDice,db=drawBoard,ub=updateBtn,ha=hideAll,ulo=updateLobby,slo=showLobby,sg=showGame,btl=backToLobby,hbc=handleBoardClick,dm=doMove,lg=addLog,sl=showLogin,cg=createGame,gc=getCoords,vm=validMove,gm=getMoves,em=execMove,cw=checkWin,nt=nextTurn,at=aiTurn,am=aiMove,ia=initAudio,tn=playTone,ns=playNoise,sgo=showGameOver,odc=onDiceClick,sc=sendChat,cl=confirmLeave,slg=startLocalGame,up=updateUI,to=toast,dp=drawPiece;
</script>
